<div class="min-h-screen bg-neutral-50 p-6 font-sans">
  <a routerLink="/" class="text-sm text-brand-600 hover:underline">
    ← Back to all tasks
  </a>
  <h1 class="my-4 text-2xl font-bold text-neutral-900">
    Task #08 — Sticky-Column Pricing Table
  </h1>

  <div class="max-w-2xl overflow-x-auto rounded-xl bg-white shadow-md">
    <table class="border-collapse">
      <thead>
        <tr>
          <th class="min-w-44 sticky left-0 z-10 bg-neutral-100 p-4 text-left text-sm font-semibold text-neutral-700">
            Feature
          </th>
          @for (plan of plans; track plan) {
          <th class="min-w-44 bg-neutral-100 p-4 text-left text-sm font-semibold text-neutral-700">
            {{plan}}
          </th>
          }
        </tr>
      </thead>
      <tbody>
        @for (feature of features; track feature.name) {
        <tr class="border-t border-neutral-200">
          <td class="min-w-44 sticky left-0 bg-white p-4 text-sm font-medium text-neutral-900">
            {{feature.name}}
          </td>
          <td class="min-w-44 p-4 text-sm text-neutral-700">{{feature.starter}}</td>
          <td class="min-w-44 p-4 text-sm text-neutral-700">{{feature.pro}}</td>
          <td class="min-w-44 p-4 text-sm text-neutral-700">{{feature.team}}</td>
          <td class="min-w-44 p-4 text-sm text-neutral-700">{{feature.enterprise}}</td>
        </tr>
        }
      </tbody>
    </table>
  </div>

</div>
