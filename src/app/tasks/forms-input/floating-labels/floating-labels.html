<div class="min-h-screen bg-neutral-50 p-6 font-sans">
  <a routerLink="/" class="text-sm text-brand-600 hover:underline">
    ← Back to all tasks
  </a>
  <h1 class="my-4 text-2xl font-bold text-neutral-900">
    Task #20 — Floating Label Inputs
  </h1>
  <div class="flex max-w-sm flex-col gap-6">
    <div class="relative">
      <input type="email" id="email" placeholder="" class="peer w-full rounded-lg border border-neutral-300 bg-white
        p-3 pt-5 text-sm outline-none focus:border-brand-500">
      <label for="email" class="pointer-events-none absolute left-3 top-3.5 text-sm text-neutral-400
      transition-all peer-focus:top-1.5 peer-focus:text-xs peer-focus:text-brand-600
      peer-not-placeholder-shown:top-1.5 peer-not-placeholder-shown:text-xs">
        Email address
      </label>
    </div>
    <div class="relative">
      <input type="text" id="company" placeholder="" class="peer w-full rounded-lg border border-neutral-300 bg-white
        p-3 pt-5 text-sm outline-none focus:border-brand-500">
      <label for="company" class="pointer-events-none absolute left-3 top-3.5 text-sm text-neutral-400
      transition-all peer-focus:top-1.5 peer-focus:text-xs peer-focus:text-brand-600
      peer-not-placeholder-shown:top-1.5 peer-not-placeholder-shown:text-xs">
        Company name
      </label>
    </div>
  </div>
</div>
