<div class="min-h-screen bg-neutral-50 p-6 font-sans">
  <a routerLink="/" class="text-sm text-brand-600 hover:underline">
    ← Back to all tasks
  </a>
  <h1 class="my-4 text-2xl font-bold text-neutral-900">
    Task #16 — Stacked Toast Notifications
  </h1>
  <div class="flex flex-wrap gap-2">
    <button type="button" (click)="addToast('success')"
      class="rounded-lg bg-brand-500 px-4 py-2 text-sm text-white hover:bg-brand-600">
      Trigger success
    </button>
    <button type="button" (click)="addToast('warning')"
      class="rounded-lg bg-neutral-700 px-4 py-2 text-sm text-white hover:bg-neutral-800">
      Trigger warning
    </button>
    <button type="button" (click)="addToast('error')"
      class="rounded-lg bg-neutral-900 px-4 py-2 text-sm text-white hover:bg-neutral-800">
      Trigger error
    </button>
  </div>
  <div class="fixed bottom-6 right-6 flex w-72 flex-col gap-2">
    @for (toast of toasts(); track toast.id) {
    <div class="flex items-start justify-between gap-3 rounded-lg border p-3 text-sm shadow-sm"
      [class.bg-brand-50]="toast.severity === 'success'" [class.border-brand-200]="toast.severity === 'success'"
      [class.text-brand-700]="toast.severity === 'success'" [class.bg-neutral-100]="toast.severity === 'warning'"
      [class.border-neutral-300]="toast.severity === 'warning'" [class.text-neutral-700]="toast.severity === 'warning'"
      [class.bg-neutral-200]="toast.severity === 'error'" [class.border-neutral-400]="toast.severity === 'error'"
      [class.text-neutral-800]="toast.severity === 'error'">
      <span>
        {{toast.message}}
      </span>
      <button type="button" (click)="dismissToast(toast.id)" class="text-xs opacity-60 hover:opacity-100">
        ✕
      </button>
    </div>
    }
  </div>
</div>
