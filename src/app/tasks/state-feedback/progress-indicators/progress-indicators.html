<div class="min-h-screen bg-neutral-50 p-6 font-sans">
  <a routerLink="/" class="text-sm text-brand-600 hover:underline">
    ← Back to all tasks
  </a>
  <h1 class="my-4 text-2xl font-bold text-neutral-900">
    Task #17 — Progress Indicators Set
  </h1>
  <div class="mb-6 flex gap-2">
    <button type="button" (click)="setPercent(25)"
      class="rounded-lg bg-neutral-200 px-3 py-1.5 text-sm text-neutral-700 hover:bg-neutral-300">25%</button>
    <button type="button" (click)="setPercent(65)"
      class="rounded-lg bg-neutral-200 px-3 py-1.5 text-sm text-neutral-700 hover:bg-neutral-300">65%</button>
    <button type="button" (click)="setPercent(100)"
      class="rounded-lg bg-neutral-200 px-3 py-1.5 text-sm text-neutral-700 hover:bg-neutral-300">100%</button>
  </div>

  <div class="grid max-w-3xl grid-cols-1 gap-6 md:grid-cols-3">
    <!-- 1. Linear bar -->
    <div class="rounded-xl bg-white p-5 shadow-sm">
      <p class="mb-3 text-sm font-semibold text-neutral-700">
        Linear bar
      </p>
      <div class="h-2 w-full rounded-full bg-neutral-200">
        <div class="h-2 rounded-full bg-brand-500 transition-all duration-300" [style.width.%]="percent()"></div>
      </div>
      <p class="mt-2 text-sm text-neutral-500">
        {{percent()}}%
      </p>
    </div>
    <!-- 2. Circular Conic Gradient -->
    <div class="rounded-xl bg-white p-5 shadow-sm">
      <p class="mb-3 text-sm font-semibold text-neutral-700">
        Circular
      </p>
      <div class="relative h-20 w-20 rounded-full transition-[background] duration-300"
        [style]="'background: conic-gradient(var(--color-brand-500) ' + (percent() * 3.6) + 'deg, var(--color-neutral-200) 0deg)'">
        <div
          class="absolute inset-2 flex items-center justify-center rounded-full bg-white text-sm font-semibold text-neutral-900">
          {{percent()}}%
        </div>
      </div>
    </div>
    <!-- 3. Stepped -->
    <div class="rounded-xl bg-white p-5 shadow-sm">
      <p class="mb-3 text-sm font-semibold text-neutral-700">Stepped</p>
      <div class="flex items-center">
        @for (step of steps; track step; let i = $index; let last = $last) {
        <div class="flex items-center" [class.flex-1]="!last">
          <span class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full text-xs"
            [class.bg-brand-500]="i <= currentStep()" [class.text-white]="i <= currentStep()"
            [class.bg-neutral-200]="i > currentStep()" [class.text-neutral-500]="i > currentStep()">
            {{i + 1}}
          </span>
          @if (!last) {
          <span class="mx-1 h-px flex-1" [class.bg-brand-500]="i < currentStep()"
            [class.bg-neutral-200]="i >= currentStep()"></span>
          }
        </div>
        }
      </div>
      <p class="mt-2 text-sm text-neutral-500">{{ steps[currentStep()] }}</p>
    </div>
  </div>
</div>
