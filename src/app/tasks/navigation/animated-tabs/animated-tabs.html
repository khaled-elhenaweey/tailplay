<div class="min-h-screen bg-neutral-50 p-6 font-sans">
  <a routerLink="/" class="text-sm text-brand-600 hover:underline">
    ← Back to all tasks
  </a>
  <h1 class="my-4 text-2xl font-bold text-neutral-900">
    Task #27 — Animated Tabs
  </h1>
  <div class="relative max-w-md rounded-xl bg-white p-2 shadow-sm">
    <div class="relative grid grid-cols-4">
      @for (tab of tabs; track tab; let i = $index) {
      <button type="button" (click)="setActive(i)"
        class="relative z-10 rounded-lg py-2 text-sm font-medium transition-colors duration-200"
        [class.text-white]="activeIndex() === i" [class.text-neutral-600]="activeIndex() !== i">
        {{tab}}
      </button>
      }
      <div class="absolute inset-y-0 left-0 w-1/4 rounded-lg bg-brand-500 transition-transform duration-300 ease-out"
        [style.transform]="'translateX(' + (activeIndex() * 100) + '%)'"></div>
    </div>
  </div>
</div>
